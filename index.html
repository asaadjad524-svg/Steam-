<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101522;
            color: white;
            text-align: center;
        }
        header {
            padding: 25px;
            background: #18243a;
        }
        h1 {
            color: #35d07f;
            font-size: 38px;
            margin: 0 0 10px 0;
        }
        header p {
            margin: 0;
            font-size: 20px;
            color: #8a99ad;
        }
        .content {
            padding: 30px 15px;
        }
        .card {
            background: #202d43;
            padding: 25px;
            margin: 15px auto;
            border-radius: 15px;
            max-width: 400px;
        }
        h2 {
            color: white;
            margin-top: 0;
        }
        .card p {
            font-size: 16px;
            color: #cbd5e1;
        }
        .btn {
            display: inline-block;
            background: #35d07f;
            color: #101522;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:hover {
            background: #2cb26b;
        }
    </style>
</head>
<body>

    <header>
        <h1>GameHub</h1>
        <p>عالم الألعاب بين إيديك</p>
    </header>

    <div class="content">
        <div class="card">
            <h2>أهلاً بك في GameHub</h2>
            <p>منصتك المجانية لاكتشاف الألعاب.</p>
            <a href="https://store.steampowered.com" class="btn" target="_blank">استكشف الألعاب</a>
        </div>
    </div>

</body>
</html>
