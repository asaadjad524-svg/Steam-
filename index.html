
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101522;
      color: white;
      text-align: center;
    }
    header {
      padding: 25px;
      background: #18243a;
    }
    h1 {
      color: #35d07f;
      font-size: 38px;
    }
    .content {
      padding: 30px 15px;
    }
    .card {
      background: #202d43;
      padding: 25px;
      margin: 15px auto;
      border-radius: 15px;
      max-width: 400px;
    }
    button {
      background: #35d07f;
      color: #101522;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <header>
    <h1>GameHub 🎮</h1>
    <p>عالم الألعاب بين إيديك</p>
  </header>

  <div class="content">
    <div class="card">
      <h2>أهلاً بك في GameHub</h2>
      <p>منصتك المجانية لاكتشاف الألعاب.</p>
      <button>استكشف الألعاب</button>
    </div>
  </div>
</body>
</html>
